name: sms

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sms}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # -h forces a TCP check. The default Unix socket answers during the
      # init phase, while the server is still only listening locally, which
      # would report healthy before the API could actually connect.
      test:
        ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-sms} -d ${POSTGRES_DB:-sms}']
      interval: 10s
      timeout: 5s
      retries: 5
      # The very first start creates the cluster, which on a slow disk takes
      # longer than retries × interval — a checkpoint sync alone can run for
      # fifteen seconds. Failures inside this window do not count against the
      # retries, so a slow laptop no longer reports the database as unhealthy
      # while it is still initialising.
      start_period: 120s
    # Not published to the host: only the API reaches the database.
    expose:
      - '5432'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--save', '60', '1', '--loglevel', 'warning']
    volumes:
      - redis-data:/data
    expose:
      - '6379'

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      # saas | standalone — see .env.example
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-saas}
      DATABASE_URL: postgresql://${POSTGRES_USER:-sms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sms}?schema=public
      # No pooler in this stack, so migrations use the same connection.
      DIRECT_URL: postgresql://${POSTGRES_USER:-sms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sms}?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      SMS_PROVIDER: ${SMS_PROVIDER:-none}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-SCHOOL}
      SMS_MAX_ATTEMPTS: ${SMS_MAX_ATTEMPTS:-3}
      AFRICASTALKING_USERNAME: ${AFRICASTALKING_USERNAME:-}
      AFRICASTALKING_API_KEY: ${AFRICASTALKING_API_KEY:-}
      AFRICASTALKING_SANDBOX: ${AFRICASTALKING_SANDBOX:-false}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-none}
      EMAIL_MAX_ATTEMPTS: ${EMAIL_MAX_ATTEMPTS:-3}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Object storage. `local` keeps uploads on the volume mounted below;
      # `r2` sends them to Cloudflare R2 and ignores the volume entirely.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_PATH: /data/uploads
      STORAGE_MAX_UPLOAD_MB: ${STORAGE_MAX_UPLOAD_MB:-10}
      STORAGE_URL_TTL_SECONDS: ${STORAGE_URL_TTL_SECONDS:-300}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      # Signed local-storage links are absolute, so the API has to know the
      # address the browser reaches it on. Defaults to the CORS origin.
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-}
    volumes:
      # Uploads under STORAGE_DRIVER=local. A named volume rather than the
      # container filesystem, so a rebuild does not take the files with it.
      # Unused, and harmless, under STORAGE_DRIVER=r2.
      - uploads:/data/uploads
    # Apply pending migrations before serving traffic. This needs the prisma
    # CLI present in the production image — see the note in server/Dockerfile.
    command: sh -c "npx prisma migrate deploy && node dist/index.js"
    expose:
      - '4000'

  # One-shot, for evaluating the system rather than running it. Loads the
  # demonstration school — 144 students, staff, fees, results and a timetable —
  # so there is something to look at and someone to sign in as.
  #
  #   docker compose --profile demo run --rm seed
  #
  # It builds from the Dockerfile's build stage because the seed is written in
  # TypeScript and the production image drops the tooling that runs it.
  # Re-running resets the demo school and leaves any other school alone.
  seed:
    profiles: ['demo']
    build:
      context: .
      dockerfile: server/Dockerfile
      target: build
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sms}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-sms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sms}?schema=public
    # Applies migrations first, so this works whether or not the API has
    # started yet.
    command: sh -c "npm run db:deploy --workspace=server && npm run db:seed --workspace=server"
    restart: 'no'

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # Empty: the browser calls /api on the same origin, proxied by nginx.
        VITE_API_URL: ''
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-8080}:80'

volumes:
  db-data:
  redis-data:
  uploads:
