name: sms

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sms}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sms} -d ${POSTGRES_DB:-sms}']
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published to the host: only the API reaches the database.
    expose:
      - '5432'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--save', '60', '1', '--loglevel', 'warning']
    volumes:
      - redis-data:/data
    expose:
      - '6379'

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      # saas | standalone — see .env.example
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-saas}
      DATABASE_URL: postgresql://${POSTGRES_USER:-sms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sms}?schema=public
      # No pooler in this stack, so migrations use the same connection.
      DIRECT_URL: postgresql://${POSTGRES_USER:-sms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sms}?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      SMS_PROVIDER: ${SMS_PROVIDER:-none}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-SCHOOL}
      SMS_MAX_ATTEMPTS: ${SMS_MAX_ATTEMPTS:-3}
      AFRICASTALKING_USERNAME: ${AFRICASTALKING_USERNAME:-}
      AFRICASTALKING_API_KEY: ${AFRICASTALKING_API_KEY:-}
      AFRICASTALKING_SANDBOX: ${AFRICASTALKING_SANDBOX:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    # Apply pending migrations before serving traffic. This needs the prisma
    # CLI present in the production image — see the note in server/Dockerfile.
    command: sh -c "npx prisma migrate deploy && node dist/index.js"
    expose:
      - '4000'

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # Empty: the browser calls /api on the same origin, proxied by nginx.
        VITE_API_URL: ''
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-8080}:80'

volumes:
  db-data:
  redis-data:
